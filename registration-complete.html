<!DOCTYPE html>
<!-- LUMINO CRAFT — REGISTRATION COMPLETE (post-payment confirmation) -->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#3BBFB8"/>
<title>Registration Complete – Lumino Craft ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --teal:#3BBFB8;--teal-d:#2A9E98;--teal-l:#E0F5F4;
  --gold:#F5C842;--ink:#1E2D2C;--muted:#5A7470;--border:#C8E8E6;
  --bg:#F8FFFE;--white:#FFFFFF;--rl:28px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Nunito",sans-serif;background:#1C2E2C;color:var(--ink);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:1.5rem;-webkit-font-smoothing:antialiased;
}
.card{
  background:var(--white);border-radius:var(--rl);border:2px solid var(--border);
  box-shadow:0 6px 32px rgba(59,191,184,.15);
  max-width:460px;width:100%;padding:3rem 2rem;text-align:center;
}
.icon{font-size:3.5rem;display:block;margin-bottom:1rem;}
h1{font-family:"Fredoka One",cursive;font-size:1.7rem;color:var(--teal-d);margin-bottom:.6rem;}
p{font-size:.92rem;color:var(--muted);line-height:1.65;margin-bottom:.5rem;}
.spinner{
  width:28px;height:28px;border:3px solid var(--teal-l);border-top-color:var(--teal);
  border-radius:50%;margin:1.2rem auto;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.details{
  background:var(--bg);border:2px solid var(--border);border-radius:16px;
  padding:1rem 1.2rem;margin-top:1.2rem;text-align:left;font-size:.85rem;
}
.details div{margin-bottom:.35rem;}
.details strong{color:var(--ink);}
a.home-link{
  display:inline-block;margin-top:1.5rem;color:var(--teal-d);font-weight:800;
  text-decoration:none;font-size:.85rem;
}
</style>
</head>
<body>

<div class="card" id="card">
  <span class="icon">⏳</span>
  <h1>Confirming your registration…</h1>
  <p>Just a moment while we confirm your payment with Square.</p>
  <div class="spinner"></div>
</div>

<script>
const SUPABASE_URL = "https://gsfygkiejcdofszntocy.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzZnlna2llamNkb2Zzem50b2N5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODA1OTgsImV4cCI6MjA5NjA1NjU5OH0.on9dfOVOUdE56vNA5X4eOURQQgcvtDljS5QthnfZpNE";

function getReferenceId(){
  const params = new URLSearchParams(window.location.search);
  return params.get("ref");
}

function showSuccess(reg){
  document.getElementById("card").innerHTML = `
    <span class="icon">🎊</span>
    <h1>You're registered!</h1>
    <p>Your registration is now complete. A confirmation email is on its way to <strong>${reg.email}</strong>.</p>
    <div class="details">
      <div><strong>Child:</strong> ${reg.child_name}</div>
      <div><strong>Venue:</strong> ${reg.venue}</div>
      <div><strong>Date/Time:</strong> ${reg.preferred_date}</div>
    </div>
    <a class="home-link" href="https://luminocraft.ca">← Back to Lumino Craft</a>
  `;
}

function showPending(){
  document.getElementById("card").innerHTML = `
    <span class="icon">✅</span>
    <h1>Payment received!</h1>
    <p>Your payment went through successfully. We're just finishing up your confirmation — you'll receive an email shortly with all the details.</p>
    <a class="home-link" href="https://luminocraft.ca">← Back to Lumino Craft</a>
  `;
}

function showError(){
  document.getElementById("card").innerHTML = `
    <span class="icon">⚠️</span>
    <h1>We couldn't find that registration</h1>
    <p>If you completed a payment, don't worry — email us at <strong>luminocraftclub@gmail.com</strong> with your name and we'll confirm your spot right away.</p>
    <a class="home-link" href="https://luminocraft.ca">← Back to Lumino Craft</a>
  `;
}

async function pollForRegistration(){
  const ref = getReferenceId();
  if(!ref){ showError(); return; }

  const maxAttempts = 8; // ~24 seconds total
  for(let i = 0; i < maxAttempts; i++){
    try{
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/registrations?reference_id=eq.${encodeURIComponent(ref)}&select=*`,
        { headers:{ "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } }
      );
      const data = await res.json();
      if(Array.isArray(data) && data.length > 0){
        showSuccess(data[0]);
        return;
      }
    } catch(e){ /* keep polling */ }
    await new Promise(r => setTimeout(r, 3000));
  }
  // Webhook may just be slow — payment still went through on Square's side
  showPending();
}

pollForRegistration();
</script>
</body>
</html>
